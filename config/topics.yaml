# Bio topics (FR-28). Each topic name maps to keywords. A keyword matches the profile
# description as a whole word, with no case difference. A keyword that starts with "re:"
# is a regular expression.
#
# A topic is a display label on the map only. No rule and no detector reads it.
# TR-06: the analyze stage refuses a topic or a keyword for politics, religion, health,
# ethnicity, sexuality, or trade-union membership.
#
# Accounts with no keyword match can get a topic from their links (label propagation,
# settings in config/visualx.toml [analyze.groups]). The page marks these as "from links".

