[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visualx"
version = "0.1.0"
description = "Private map of the owner's X network, with explainable signal states"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Ron Dilley" }]
dependencies = [
  "httpx>=0.27",
  "keyring>=25",
  "igraph>=0.11",
  "leidenalg>=0.10",
  "jinja2>=3.1",
  "pyyaml>=6",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.48"]

[project.scripts]
visualx = "visualx.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/visualx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "slow: performance tests (TSC-12, TSC-13, TSC-23)",
  "browser: Playwright tests (TSC-19 to TSC-21, TSC-32)",
  "validation: labeled benchmark of the pattern detectors (tests/validation, about 20 s)",
]
addopts = "-m 'not slow'"
